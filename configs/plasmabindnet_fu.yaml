model: PlasmaBindNet-Fu
task: plasma protein binding regression
target_transform: logit_free_fraction
ensemble_seeds: [2044, 2038, 2037, 2022, 2032]
loss: huber
huber_delta: 1.0
sampler_weighting: power_inverse
sampler_weight_power: 0.25
bin_weighting: none
auxiliary_loss: {type: binary_low, weight: 0.05, ppb_threshold: 0.4}
prediction_clip: 0.0001
epochs: 60
batch_size: 64
learning_rate: 0.0001
adam_epsilon: 0.00001
weight_decay: 0.0000001
early_stopping_patience: 20
checkpoint_selection: valid_fu_mae_abs_ppb_bias
bias_penalty_weight: 0.5
set_layer: SetRep
network: {molecular_input: 43, hidden_channels: 300, message_passing_layers: 2, clique_steps: 1, set_hidden: 64, set_elements: 32, dropout: 0.0}
