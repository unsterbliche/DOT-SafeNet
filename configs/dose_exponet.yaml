model: DoseExpoNet
task: dose-dependent total Cmax regression
ensemble_seeds: [1998, 2022, 2023, 2024, 2025]
set_layer: SetRep
epochs: 200
batch_size: 64
learning_rate: 0.0001
adam_betas: [0.9, 0.999]
adam_epsilon: 0.00001
weight_decay: 0.0000001
